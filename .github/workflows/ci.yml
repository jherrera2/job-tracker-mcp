name: CI

# Runs on every PR (and each new commit pushed to it) and on pushes to main
# (i.e. merges). Feature-branch pushes without a PR don't run it, so a PR
# branch isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # A throwaway Postgres 17 for the integration tests, started before the steps run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobsearch
          POSTGRES_PASSWORD: jobsearch
          POSTGRES_DB: jobsearch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobsearch -d jobsearch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://jobsearch:jobsearch@localhost:5432/jobsearch_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
